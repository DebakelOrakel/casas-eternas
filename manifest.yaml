# The OLD OpenShift address of casas-eternas, kept alive as a redirect to its
# new home, https://casas-eternas.ahoi.sh. Apply it in the old namespace
# after the server there is gone:
#
#   oc apply -f manifest.yaml
#
# The Route keeps the old name and no host, so OpenShift gives it the same
# address as before (casas-eternas-<namespace>.apps.<cluster>). Behind it a
# small nginx answers every request with a 301 to the same path and query on
# the new host; the HTML page is only what a client that ignores the header
# sees.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casas-eternas-redirect
  labels:
    app: casas-eternas-redirect
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # For the probes: answered here, not redirected.
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # Everything else moves, path and query kept. 301: the move is for
      # good, so browsers and links may remember it.
      location / {
        error_page 301 /moved.html;
        return 301 https://casas-eternas.ahoi.sh$request_uri;
      }

      # The body of the 301, for a client that shows it; the Location header
      # stays the one the return above set.
      location = /moved.html {
        internal;
        root /usr/share/nginx/html;
      }
    }
  moved.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta http-equiv="refresh" content="0; url=https://casas-eternas.ahoi.sh/">
      <title>Casas Eternas has moved</title>
    </head>
    <body>
      <p>Casas Eternas has moved to <a href="https://casas-eternas.ahoi.sh/">casas-eternas.ahoi.sh</a>.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casas-eternas-redirect
  labels:
    app: casas-eternas-redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casas-eternas-redirect
  template:
    metadata:
      labels:
        app: casas-eternas-redirect
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          # The unprivileged build: listens on 8080 and runs as any UID, as
          # OpenShift's restricted-v2 assigns one.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: config
              mountPath: /usr/share/nginx/html/moved.html
              subPath: moved.html
              readOnly: true
            # nginx's pid file and temporary files, on a read-only root.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: casas-eternas-redirect
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: casas-eternas-redirect
  labels:
    app: casas-eternas-redirect
spec:
  type: ClusterIP
  selector:
    app: casas-eternas-redirect
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# The old Route, unchanged but for where it points: same name, no host, so
# the address stays what it was.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas-redirect
spec:
  # No host → OpenShift assigns one on the default apps domain.
  to:
    kind: Service
    name: casas-eternas-redirect
    weight: 100
  port:
    targetPort: http
  # Serve over HTTPS with the router's default cert; redirect plain HTTP to it.
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
