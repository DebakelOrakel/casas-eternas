# The engine gives the same bits in every build only through det_math
# (crates/casas-engine/src/det_math.rs): the std functions below differ
# between platforms in the last bit, and mul_add is not what the TypeScript
# engine computes. sqrt, abs, floor, round, min and max are exact and stay.
disallowed-methods = [
  { path = "f64::exp", reason = "use det_math::det_exp" },
  { path = "f64::exp2", reason = "use det_math" },
  { path = "f64::exp_m1", reason = "use det_math" },
  { path = "f64::ln", reason = "use det_math::det_log" },
  { path = "f64::log", reason = "use det_math" },
  { path = "f64::log2", reason = "use det_math::det_log2" },
  { path = "f64::log10", reason = "use det_math" },
  { path = "f64::ln_1p", reason = "use det_math" },
  { path = "f64::powf", reason = "use det_math::det_pow" },
  { path = "f64::powi", reason = "use det_math::det_pow" },
  { path = "f64::sin", reason = "use det_math::det_sin" },
  { path = "f64::cos", reason = "use det_math::det_cos" },
  { path = "f64::sin_cos", reason = "use det_math::det_sin and det_cos" },
  { path = "f64::tan", reason = "use det_math::det_tan" },
  { path = "f64::asin", reason = "use det_math::det_asin" },
  { path = "f64::acos", reason = "use det_math::det_acos" },
  { path = "f64::atan", reason = "use det_math::det_atan" },
  { path = "f64::atan2", reason = "use det_math::det_atan2" },
  { path = "f64::hypot", reason = "use det_math::det_hypot" },
  { path = "f64::cbrt", reason = "use det_math" },
  { path = "f64::sinh", reason = "use det_math" },
  { path = "f64::cosh", reason = "use det_math" },
  { path = "f64::tanh", reason = "use det_math" },
  { path = "f64::asinh", reason = "use det_math" },
  { path = "f64::acosh", reason = "use det_math" },
  { path = "f64::atanh", reason = "use det_math" },
  { path = "f64::mul_add", reason = "the TypeScript engine has no fused multiply-add" },
  { path = "f32::exp", reason = "use det_math" },
  { path = "f32::ln", reason = "use det_math" },
  { path = "f32::powf", reason = "use det_math" },
  { path = "f32::powi", reason = "use det_math" },
  { path = "f32::sin", reason = "use det_math" },
  { path = "f32::cos", reason = "use det_math" },
  { path = "f32::atan2", reason = "use det_math" },
  { path = "f32::hypot", reason = "use det_math" },
  { path = "f32::mul_add", reason = "the TypeScript engine has no fused multiply-add" },
]
