[package]
name = "casas-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `parallel`: the stages that compute per node or per block run on rayon's
# pool. The result is the same bits with it or without it: the work is cut
# into fixed blocks, independent of the number of threads, and put together
# in their order. The native build turns it on; the WASM build stays on one
# thread.
[features]
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
