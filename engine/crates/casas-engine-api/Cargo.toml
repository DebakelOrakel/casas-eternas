[package]
name = "casas-engine-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The engine's surface to TypeScript (docs/decisions/rust-engine.md,
# fork 6): a world as an object, its methods over plain data. Both
# binding crates wrap it; it knows neither.
[features]
parallel = ["casas-engine/parallel"]

[dependencies]
casas-engine = { path = "../casas-engine" }
serde_json = "1"
