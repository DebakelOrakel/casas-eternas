# Read by rustup only. A Rust without rustup (e.g. Homebrew's) ignores this
# file and has no wasm32 target.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# wasm32-wasip1: the engine's tests run as WASM under Node (make test).
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
