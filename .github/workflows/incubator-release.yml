# The incubator's release (docs/decisions/incubator-history-engine.md): a tag
# that starts with `incubator` builds the incubator for the job
# worker and puts the builds on a GitHub release of that tag.
#
#   git tag incubator-v1-7744e9f7c599f615 && git push origin incubator-v1-7744e9f7c599f615
#
# The tag is `incubator-` and the incubator's version (casas-incubator
# tuning.rs incubator_version; `casas-eternas version` tells it): the route
# of the history jobs' tasks, whose workers take this release where they were
# not shipped with it (internal/modules/jobs, releaseTags).
#
# The assets:
#   casas-incubator-darwin-arm64.node     the incubator's native build on a Mac
#   casas-incubator-linux-amd64.node      on Linux with glibc (as `make engines`)
#   casas-incubator-windows-amd64.node    on Windows
#   casas-engine-<os>-<arch>.node       the engine's, which reads the save and level 1
#   pipeline.json                       the incubator's version
#   constants.json                      the tuning the version hashes
#   pipeline.mjs                        the incubator's module (incubator.mjs); the name the launcher fetches
#   SHA256SUMS
#
# No tests here, as in engine-release.yml: `make test` before a tag.

name: incubator release

on:
  push:
    tags: ['incubator*']

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The module bundles the engine's constants and the incubator's version;
      # buildWorker.mjs copies the native builds beside the bundles, which
      # this job has none of, and --version loads neither, so empty files
      # stand in. They are not uploaded.
      - name: Incubator version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p engine/dist/incubator
          (cd engine && cargo run --release --locked -q -p casas-engine-api --bin constants > dist/constants.json)
          (cd engine && cargo run --release --locked -q -p casas-incubator --bin incubator-version > dist/incubator/version.json)
          (cd engine && cargo run --release --locked -q -p casas-incubator --bin incubator-constants > dist/incubator/constants.json)
          touch engine/dist/casas-engine.node engine/dist/casas-incubator.node
          (cd client && npm ci && node scripts/buildWorker.mjs "$RUNNER_TEMP/worker/job-worker.mjs")
          node "$RUNNER_TEMP/worker/job-worker.mjs" --version --pipeline "$RUNNER_TEMP/worker/incubator.mjs" > engine/dist/pipeline.json
          cat engine/dist/pipeline.json
          version=$(node -p 'require("./engine/dist/pipeline.json").pipelineVersion')
          if [ "$GITHUB_REF_NAME" != "incubator-$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but this commit's incubator is $version: tag it incubator-$version."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is released already: a change to the incubator's code raises INCUBATOR_ALGO_VERSION."
            exit 1
          fi
      - run: |
          mkdir -p out
          cp engine/dist/pipeline.json out/
          cp engine/dist/incubator/constants.json out/
          cp "$RUNNER_TEMP/worker/incubator.mjs" out/pipeline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: out/

  darwin:
    needs: module
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p casas-engine-node -p casas-incubator-node --target aarch64-apple-darwin
      - run: |
          mkdir -p out
          cp engine/target/aarch64-apple-darwin/release/libcasas_engine_node.dylib out/casas-engine-darwin-arm64.node
          cp engine/target/aarch64-apple-darwin/release/libcasas_incubator_node.dylib out/casas-incubator-darwin-arm64.node
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: out/

  linux:
    needs: module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # In Rust's Debian image, for the glibc of `make engines`, not the
      # runner's.
      - name: Build
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/engine:/src" -w /src \
            -e RUSTUP_TOOLCHAIN=1.98.1 -e CARGO_TARGET_DIR=/src/target/linux-amd64 \
            rust:1.98.1-bookworm cargo build --release --locked -p casas-engine-node -p casas-incubator-node
      - run: |
          mkdir -p out
          cp engine/target/linux-amd64/release/libcasas_engine_node.so out/casas-engine-linux-amd64.node
          cp engine/target/linux-amd64/release/libcasas_incubator_node.so out/casas-incubator-linux-amd64.node
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  windows:
    needs: module
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p casas-engine-node -p casas-incubator-node --target x86_64-pc-windows-msvc
      - run: |
          mkdir -p out
          cp engine/target/x86_64-pc-windows-msvc/release/casas_engine_node.dll out/casas-engine-windows-amd64.node
          cp engine/target/x86_64-pc-windows-msvc/release/casas_incubator_node.dll out/casas-incubator-windows-amd64.node
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  release:
    needs: [module, darwin, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "The incubator at $GITHUB_SHA, version \`$(jq -r .pipelineVersion out/pipeline.json)\`." > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
