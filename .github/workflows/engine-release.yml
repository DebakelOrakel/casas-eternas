# The engine's release (docs/decisions/rust-engine.md): a tag that starts
# with `engine` builds the engine and puts the builds on a GitHub release
# of that tag.
#
#   git tag engine-v12-53fe6efa9b110bf0 && git push origin engine-v12-53fe6efa9b110bf0
#
# The tag is `engine-` and the pipeline a world.yaml records as
# `status.pipeline` (world/worldPipeline.ts; `casas-eternas version` tells
# it), so a save names the release of the engine that made it.
#
# The assets:
#   casas-engine-darwin-arm64.node      the job worker's engine on a Mac
#   casas-engine-linux-amd64.node       on Linux with glibc (as `make engines`)
#   casas-engine-windows-amd64.node     on Windows
#   casas-engine-wasm.tar.gz            the generator's engine (wasm/ of engine/dist)
#   constants.json                      the pipeline's constants
#   pipeline.json                       the pipeline's versions: the world's and each tile level's
#   pipeline.mjs                        the job worker's pipeline module; it reads what the engine computes
#   SHA256SUMS
#
# The builds are the ones `make engines` and `make engine` make, with the
# same images and the same flags. The toolchain is engine/rust-toolchain.toml's.
# No musl build: the container image takes the linux/amd64 one
# (deploy/Dockerfile, stage 0), on a glibc base.
#
# NO TESTS HERE (2026-10-22): the engine's tests, the WASI run and the
# smoke test run where the engine is made, `make test` before a tag. Here
# they took most of the time and runners for what was tested already. The
# one check is the tag's: it must be this commit's pipeline (below).

name: engine release

on:
  push:
    tags: ['engine*']

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs engine/rust-toolchain.toml's toolchain and targets.
      - run: rustup toolchain install
        working-directory: engine
      # The CLI must be the crate's version (casas-engine-wasm/Cargo.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build
        working-directory: engine
        run: |
          cargo build --release --locked -p casas-engine-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir dist/wasm --out-name casas-engine \
            target/wasm32-unknown-unknown/release/casas_engine_wasm.wasm
          cargo run --release --locked -q -p casas-engine-api --bin constants > dist/constants.json
      # Before the native builds, which wait for this job. The versions are the job worker's
      # (`job-worker.mjs --version`). buildWorker.mjs copies the native
      # engine beside the bundles; this job has none, and --version does not
      # load it, so an empty file stands in. It is not uploaded. The
      # pipeline module is (client/scripts/workerContract.ts: it holds the
      # read side in TypeScript, DEC-0044 fork 7, so an engine without its
      # module cannot run a pipeline); the host, job-worker.mjs, is not:
      # every installation runs its own.
      #
      # `status.pipeline` does not hash the tile levels' constants. A change
      # to those only gives another engine under the same tag; the release
      # of the tag tells it by its pipeline.json.
      - name: Pipeline versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch engine/dist/casas-engine.node
          (cd client && npm ci && node scripts/buildWorker.mjs "$RUNNER_TEMP/worker/job-worker.mjs")
          node "$RUNNER_TEMP/worker/job-worker.mjs" --version > engine/dist/pipeline.json
          cat engine/dist/pipeline.json
          version=$(node -p 'require("./engine/dist/pipeline.json").pipelineVersion')
          if [ "$GITHUB_REF_NAME" != "engine-$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but this commit's pipeline is $version: tag it engine-$version."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if ! gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p pipeline.json -O "$RUNNER_TEMP/released.json"; then
              echo "::error::$GITHUB_REF_NAME is released already, without pipeline.json."
            elif cmp -s "$RUNNER_TEMP/released.json" engine/dist/pipeline.json; then
              echo "::error::$GITHUB_REF_NAME is released already, with the same versions."
            else
              echo "::error::$GITHUB_REF_NAME is released already, with other versions: a constant outside status.pipeline changed. Increase AMPLIFICATION_ALGO_VERSION."
              diff "$RUNNER_TEMP/released.json" engine/dist/pipeline.json || true
            fi
            exit 1
          fi
      - run: |
          mkdir -p out
          tar -czf out/casas-engine-wasm.tar.gz -C engine/dist wasm
          cp engine/dist/constants.json engine/dist/pipeline.json "$RUNNER_TEMP/worker/pipeline.mjs" out/
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: out/

  darwin:
    needs: wasm
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: engine
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p casas-engine-node --target aarch64-apple-darwin
      - run: |
          mkdir -p out
          cp engine/target/aarch64-apple-darwin/release/libcasas_engine_node.dylib out/casas-engine-darwin-arm64.node
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: out/

  linux:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # In Rust's Debian image, for the glibc of `make engines`, not the
      # runner's.
      - name: Build
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/engine:/src" -w /src \
            -e RUSTUP_TOOLCHAIN=1.98.1 -e CARGO_TARGET_DIR=/src/target/linux-amd64 \
            rust:1.98.1-bookworm cargo build --release --locked -p casas-engine-node
      - run: |
          mkdir -p out
          cp engine/target/linux-amd64/release/libcasas_engine_node.so out/casas-engine-linux-amd64.node
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  windows:
    needs: wasm
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: engine
      # MSVC. napi-rs loads Node's symbols at run time on Windows, so the
      # build needs no node.lib.
      - name: Build
        working-directory: engine
        run: cargo build --release --locked -p casas-engine-node --target x86_64-pc-windows-msvc
      - run: |
          mkdir -p out
          cp engine/target/x86_64-pc-windows-msvc/release/casas_engine_node.dll out/casas-engine-windows-amd64.node
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  release:
    needs: [wasm, darwin, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes tell the versions of pipeline.json, for a reader.
        run: |
          {
            echo "The engine at $GITHUB_SHA."
            echo
            echo "| Stage | Pipeline version |"
            echo "|---|---|"
            jq -r '"| world (`status.pipeline`) | `\(.pipelineVersion)` |",
              (.tilePipelineVersions | to_entries[] | "| tiles of level \(.key) | `\(.value)` |")' out/pipeline.json
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
