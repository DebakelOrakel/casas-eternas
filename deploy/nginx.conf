# nginx config for serving the built SPA under an arbitrary (OpenShift) UID.
# Key points for a random non-root UID:
#   - no `user` directive (a non-root master cannot setuid to another user)
#   - pid + all temp paths live under /tmp (world-writable, so any UID can use them)
#   - listens on an unprivileged port (8080)
#   - logs go to stdout/stderr

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    # Keep every writable path as a direct child of /tmp so the container works
    # with a read-only root filesystem + a writable /tmp (emptyDir). Flat (not
    # nested) so nginx can create each dir under the fresh /tmp mount at startup.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml font/woff2;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Fingerprinted build assets — safe to cache forever.
        location /assets/ {
            try_files $uri =404;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA: everything else falls back to the app shell (never cache it).
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
