# Two components, the most today's server allows a browser to use. The
# browser reads /v1/capabilities and the login path from the component with
# the client, which reports only its own modules, so client, auth, world,
# jobs and docs stay together (DEC-0043, Status). And artifacts stays with
# world: every process checks its peers at start, artifacts needs world and
# jobs needs artifacts, so apart they would wait for each other forever.
# What can go apart is the relay, with its JetStream on a volume of its own.
components:
  # Helm merges maps: the default component goes only when set to null.
  server: null
  front:
    targets: [client, docs, auth, world, artifacts, jobs]
    persistence: { size: 20Gi }
  relay:
    targets: [relay]
    persistence: { size: 2Gi }
