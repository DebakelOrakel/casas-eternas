# Three components (docs/decisions/helm-chart.md, fork 1): the edge is
# stateless and scales; the stores hold the only data that cannot be made
# again; compute is the coordinator and its bus, which talk all the time.
# The edge is what the browser asks: it names the login (in password mode)
# and reports the other components' modules under /v1/capabilities
# (global.peers, which the chart sets). The components start in any order:
# a process whose peer does not answer yet starts and asks again.
components:
  # Helm merges maps: the default component goes only when set to null.
  server: null
  edge:
    targets: [client, docs]
    replicas: 2
  stores:
    targets: [world, artifacts, auth]
    persistence: { size: 20Gi }
  compute:
    targets: [jobs, relay]
    persistence: { size: 5Gi }
