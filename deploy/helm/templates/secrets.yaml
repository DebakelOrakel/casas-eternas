{{- /*
Secrets made from the values (`create: true`), for a throwaway install only:
a value in a values file is a secret in Git or in Helm's release history.
By default every role references a Secret made outside the chart.
*/}}
{{- range $role, $secret := .Values.secrets }}
{{- if and $secret.create $secret.name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  labels:
    {{- include "casas-eternas.labels" $ | nindent 4 }}
    casas-eternas/secret-role: {{ $role }}
type: Opaque
stringData:
  {{- toYaml ($secret.data | default dict) | nindent 2 }}
{{- end }}
{{- end }}
