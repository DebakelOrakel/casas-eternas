# Kubernetes manifests for casas-eternas: ONE binary serving the client, the
# docs site, the world store, the artifact store, the job coordinator and
# the login (auth target; users administered over the admin socket, see
# deploy/README.md), plus the job workers it scales.
# PVC + Deployments + Service + Ingress — plain Kubernetes objects, the
# certificate from cert-manager (ClusterIssuer letsencrypt-production). The
# security contexts satisfy OpenShift's restricted-v2 as well.
#
# SET THE HOST in the Ingress at the end before the first apply.
#
#   kubectl apply -f deploy/manifests.yaml
#
# Set `image:` below to where you pushed the image built from deploy/Dockerfile
# (e.g. the internal registry: image-registry.openshift-image-registry.svc:5000/<ns>/casas-eternas:latest).
---
# The identity the server creates bake Jobs as. Without it the pod runs as the
# namespace's `default` account, which has no permissions at all — and the
# first bake would fail with "jobs.batch is forbidden", minutes after someone
# asked for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
---
# Namespaced, never cluster-wide: the server creates Jobs and scales its
# workers beside itself and has no business anywhere else. `delete` is what
# removes finished Jobs on the spot and prunes retained failed ones; `list`
# is the retention sweep's view.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: casas-eternas-jobs
  labels:
    app: casas-eternas
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # The worker Deployment the jobs module scales (internal/modules/jobs,
  # scaler.go): found by its label, its replicas read and set through the
  # scale subresource. Nothing else on Deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: casas-eternas-jobs
  labels:
    app: casas-eternas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: casas-eternas-jobs
subjects:
  - kind: ServiceAccount
    name: casas-eternas
---
# Worlds are IRREPLACEABLE and artifacts are merely expensive, but they share
# one claim because they share one process. Splitting them would only pay off
# once the modules run in separate pods — which is exactly what --target makes
# possible, so this is the shape to revisit then, not now.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casas-eternas-data
  labels:
    app: casas-eternas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # A world save is tens of megabytes; a baked 8k artifact is ~64 MB and
      # every pipeline version keeps its own. This fills up faster than it
      # looks — artifacts are droppable, so a size cap is the eventual answer.
      storage: 20Gi
---
# What authentication needs that must not be in git: the key session tokens
# are signed with. Applied EMPTY on purpose — the resource exists so the
# Deployment can mount it and nobody has to remember its name, and the value
# is put in afterwards (see deploy/README.md).
#
#   oc create secret generic casas-eternas-auth \
#     --from-literal=session.key="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | oc apply -f -
#
# Without session.key a restart ends every session, and two replicas reject each
# other's tokens. The USERS are not in here: they are state in auth.db on the
# data volume, administered over the pod's admin socket — `oc exec` +
# `casas-eternas auth user …` (docs/decisions/server-user-admin.md).
apiVersion: v1
kind: Secret
metadata:
  name: casas-eternas-auth
  labels:
    app: casas-eternas
type: Opaque
stringData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
    casas-eternas/component: server
spec:
  replicas: 1
  # `component: server` keeps this Deployment's pods apart from the
  # workers' (same `app`, `component: worker`) — and the Service selects on
  # it too. A selector cannot change on a live Deployment: a cluster from
  # before this label needs `oc delete deploy/casas-eternas` once before the
  # apply (the data volume stays).
  selector:
    matchLabels:
      app: casas-eternas
      casas-eternas/component: server
  template:
    metadata:
      labels:
        app: casas-eternas
        casas-eternas/component: server
    spec:
      serviceAccountName: casas-eternas
      containers:
        - name: casas-eternas
          image: ghcr.io/debakelorakel/casas-eternas:latest
          imagePullPolicy: Always
          env:
            # A bake Job may land on ANY node — usually not this one — so it
            # cannot count on mounting this pod's ReadWriteOnce volume and
            # reaches the server over HTTP instead. The pod's own IP is the
            # address it comes back to, and it needs no Service to exist first.
            - name: CASAS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The image a bake Job runs. THE SAME as this container's, and that
            # is not tidiness: the artifact key carries a pipeline version, so
            # a baker from a different build produces artifacts no client will
            # ever look for — a failure that looks exactly like success.
            - name: CASAS_JOBS_IMAGE
              value: ghcr.io/debakelorakel/casas-eternas:latest
            # At most three job workers: the most replicas the jobs server
            # scales casas-eternas-worker to. Each reserves its honest 7Gi, so
            # the ceiling in practice is the nodes' free memory — beyond it
            # the extra workers sit Pending and the work waits for them.
            - name: CASAS_JOBS_MAX_CONCURRENT
              value: "3"
            # Authentication. Environment rather than args because CMD already
            # carries the flag list and repeating it here to append a few would
            # be two places to keep in step; every config key is reachable as
            # CASAS_<KEY> with dots and dashes as underscores (see cmd/root.go's
            # initConfig).
            # The compiled default is `none` (the local mode) — this line is
            # what makes the deployment an authenticated server. Losing it
            # means an OPEN server; it is configuration, guard it like the
            # Secret.
            - name: CASAS_GLOBAL_AUTH_MODE
              value: password
            - name: CASAS_GLOBAL_AUTH_SESSION_KEY
              value: /etc/casas-eternas/auth/session.key
            # The local admin channel: user administration over `oc exec` +
            # `casas-eternas auth user …`. A unix socket, so reaching it IS
            # the authorization — gated by pods/exec RBAC, not by a
            # credential. /tmp is the pod's emptyDir below.
            - name: CASAS_GLOBAL_ADMIN_SOCKET
              value: /tmp/admin.sock
            # The relay (NATS) on every interface, for the job workers in
            # their own pods. Safe to open because this is an authenticated
            # server: the relay then admits only this server's own tokens — a
            # worker's limited to the jobs it serves (internal/modules/relay).
            # Never set this on a server in mode `none`: its relay checks
            # nobody.
            - name: CASAS_RELAY_LISTEN
              value: 0.0.0.0:4222
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: relay
              containerPort: 4222
              protocol: TCP
          # /v1/capabilities rather than "/": it answers only once the modules
          # are mounted, so readiness means "can actually serve", not "has a
          # file". "/" would go green on a pod whose storage failed to open.
          readinessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # Sized for what this pod actually does. An 8192² bake peaks near
          # 2.6 GB in the Node subprocess — that is the number the limit has to
          # clear, or the kernel kills the bake at 90% with no useful message.
          # The request stays low because that peak lasts minutes, not always.
          #
          # If this feels heavy for a pod that mostly serves files: that is the
          # argument for running `--target bake` in its own pod (or as a
          # Kubernetes Job), which the module split already allows.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 4Gi
          # Hardened, OpenShift restricted-v2 friendly. No runAsUser — OpenShift
          # injects an arbitrary UID from the namespace range (member of GID 0);
          # the image is built for exactly that. Verified with a read-only rootfs.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            # The bake subprocess is the only thing that wants scratch space,
            # and it wants real disk rather than memory: a tmpfs would come out
            # of the same budget the bake is already straining.
            - name: tmp
              mountPath: /tmp
            - name: auth
              mountPath: /etc/casas-eternas/auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: casas-eternas-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: auth
          secret:
            secretName: casas-eternas-auth
            # optional, so a Secret that is still empty lets the pod SCHEDULE and
            # fail with the server's own message about the missing key — rather
            # than hanging in ContainerCreating, where the reason is a kubelet
            # event nobody thinks to read.
            optional: true
            defaultMode: 0400
---
# The JOB WORKERS: long-lived Node processes serving the jobs coordinator's
# tasks over the relay (docs/decisions/detail-ladder.md, addendum
# 2026-10-03). The jobs server SCALES THIS DEPLOYMENT ITSELF: up when tasks
# wait (to at most jobs.max-concurrent), never down while a job is open, and
# back to zero when every job is through. It finds it by the
# `casas-eternas/component: worker` label, so keep that label, and do not
# manage `replicas` from anywhere else — applying this file sets it to 0,
# which ends a running refinement's workers (the tasks are handed out again
# when they come back, so nothing is lost but time).
#
# The workers prove themselves with a SERVICE ACCOUNT of this server's auth
# system — the same kind an outside worker uses. Once, after the first start:
#
#   oc exec deploy/casas-eternas -- casas-eternas auth service add cluster-workers > credentials
#   oc create secret generic casas-eternas-worker --from-file=credentials
#   rm credentials
#
# Rotating: `auth service rotate cluster-workers`, then replace the Secret;
# workers read the file again at every token trade, so no restart is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casas-eternas-worker
  labels:
    app: casas-eternas
    casas-eternas/component: worker
spec:
  replicas: 0
  # `component: worker` keeps these pods apart from the server's
  # (`component: server`), whose Deployment and Service select on that.
  selector:
    matchLabels:
      app: casas-eternas
      casas-eternas/component: worker
  template:
    metadata:
      labels:
        app: casas-eternas
        casas-eternas/component: worker
    spec:
      # No API access: a worker talks to the relay and the server, nothing
      # in the cluster.
      automountServiceAccountToken: false
      containers:
        - name: worker
          # THE SAME image as the server: the artifacts a worker writes carry
          # a pipeline version, and a worker from another build writes ones
          # no client looks for.
          image: ghcr.io/debakelorakel/casas-eternas:latest
          imagePullPolicy: Always
          # The heap ceiling is the jobs module's nodeHeapMB; the bus at the
          # Service's relay port, the token trade at its HTTP port.
          command:
            - node
            - --max-old-space-size=6144
            - /app/job-worker.mjs
            - --serve
            - '{"relay":"nats://casas-eternas:4222","pools":["level","tile"],"auth":"http://casas-eternas:8080"}'
          env:
            - name: RELAY_CREDENTIALS
              value: /etc/casas-eternas/worker/credentials
          # A level-1 replay held 6.2 GB on one worker (detail-ladder.md);
          # the request reserves that, the limit leaves room for a large
          # world. Not yet measured in the cluster.
          # In this deployment the requests are intentionally low for the lab.
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              memory: 10Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /etc/casas-eternas/worker
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: credentials
          secret:
            secretName: casas-eternas-worker
            # Optional for the reason the auth Secret is: a worker without it
            # starts and says the file is missing, instead of hanging in
            # ContainerCreating.
            optional: true
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
spec:
  type: ClusterIP
  # The server alone: not the workers, nor a bake Job's pods, which share
  # `app: casas-eternas`.
  selector:
    app: casas-eternas
    casas-eternas/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # The relay, for the job workers: nats://casas-eternas:4222 inside the
    # namespace. Not on the Ingress — workers are in the cluster, nobody else
    # speaks NATS to this server.
    - name: relay
      port: 4222
      targetPort: relay
      protocol: TCP
---
# The way in from outside: the HTTP API, the client and the docs site.
# Native networking.k8s.io/v1, so any controller serves it. The certificate
# comes from cert-manager through the `letsencrypt-production` ClusterIssuer,
# into the Secret `casas-eternas-tls` it creates and renews.
#
# - Uploads: a saved world is tens of megabytes. A controller with a body
#   limit must allow them; ingress-nginx's default (1 MiB) refuses them:
#   `nginx.ingress.kubernetes.io/proxy-body-size: "0"`.
# - On OpenShift, the router turns this into a Route by itself.
#
# The relay (NATS) is not here: workers reach it inside the cluster, on the
# Service's `relay` port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  # The cluster's default class unless named here.
  # ingressClassName: nginx
  tls:
    - hosts:
        - casas-eternas.ahoi.sh
      secretName: casas-eternas-tls
  rules:
    # SET THIS (and the host above): the name the server is reached by.
    - host: casas-eternas.ahoi.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casas-eternas
                port:
                  name: http
