# OpenShift manifests for casas-eternas: ONE binary serving the client, the
# world store, the artifact store and the bake worker.
# PVC + Deployment + Service + Route. Route has NO host, so OpenShift generates
# one on the cluster's default apps domain:
# casas-eternas-<namespace>.apps.<cluster>.
#
#   oc apply -f deploy/manifests.yaml
#   oc get route casas-eternas -o jsonpath='{.spec.host}{"\n"}'
#
# Set `image:` below to where you pushed the image built from deploy/Dockerfile
# (e.g. the internal registry: image-registry.openshift-image-registry.svc:5000/<ns>/casas-eternas:latest).
---
# The identity the server creates bake Jobs as. Without it the pod runs as the
# namespace's `default` account, which has no permissions at all — and the
# first bake would fail with "jobs.batch is forbidden", minutes after someone
# asked for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
---
# Namespaced, never cluster-wide: the server creates Jobs beside itself and has
# no business anywhere else. `delete` is here because a finished bake pod keeps
# its 3 GB reservation — and keeps a node occupied against the anti-affinity
# rule — until it is removed; the TTL alone would leave it there for minutes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: casas-eternas-bake
  labels:
    app: casas-eternas
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: casas-eternas-bake
  labels:
    app: casas-eternas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: casas-eternas-bake
subjects:
  - kind: ServiceAccount
    name: casas-eternas
---
# Worlds are IRREPLACEABLE and artifacts are merely expensive, but they share
# one claim because they share one process. Splitting them would only pay off
# once the modules run in separate pods — which is exactly what --target makes
# possible, so this is the shape to revisit then, not now.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casas-eternas-data
  labels:
    app: casas-eternas
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # A world save is tens of megabytes; a baked 8k artifact is ~64 MB and
      # every pipeline version keeps its own. This fills up faster than it
      # looks — artifacts are droppable, so a size cap is the eventual answer.
      storage: 20Gi
---
# What authentication needs that must not be in git: the users and the key their
# session tokens are signed with. Applied EMPTY on purpose — the resource exists
# so the Deployment can mount it and nobody has to remember its name, and the
# values are put in afterwards (see deploy/README.md).
#
#   oc create secret generic casas-eternas-auth \
#     --from-file=htpasswd=./htpasswd \
#     --from-literal=session.key="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | oc apply -f -
#
# Without session.key a restart ends every session, and two replicas reject each
# other's tokens. Without htpasswd the pod does not start at all, which is the
# intended failure for a server told to check identity that cannot.
#
# Note what this costs, decided 2026-08-09: a Secret mount is READ-ONLY, so the
# planned user administration cannot add a user by writing this file. It would
# have to write the Secret through the Kubernetes API instead — a few lines of
# RBAC on the ServiceAccount that already exists.
# (docs/decisions/server-auth.md, "Where the file lives")
apiVersion: v1
kind: Secret
metadata:
  name: casas-eternas-auth
  labels:
    app: casas-eternas
type: Opaque
stringData: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casas-eternas
  template:
    metadata:
      labels:
        app: casas-eternas
    spec:
      serviceAccountName: casas-eternas
      containers:
        - name: casas-eternas
          image: ghcr.io/debakelorakel/casas-eternas:latest
          imagePullPolicy: Always
          env:
            # A bake Job runs on ANOTHER node — the anti-affinity puts it there
            # — so it cannot mount this pod's ReadWriteOnce volume and reaches
            # the server over HTTP instead. The pod's own IP is the address it
            # comes back to, and it needs no Service to exist first.
            - name: CASAS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The image a bake Job runs. THE SAME as this container's, and that
            # is not tidiness: the artifact key carries a pipeline version, so
            # a baker from a different build produces artifacts no client will
            # ever look for — a failure that looks exactly like success.
            - name: CASAS_BAKE_IMAGE
              value: ghcr.io/debakelorakel/casas-eternas:latest
            # Authentication. Environment rather than args because CMD already
            # carries the flag list and repeating it here to append three would
            # be two places to keep in step; viper binds every flag to
            # CASAS_<FLAG> (see cmd/root.go's initConfig).
            #
            # THE POD WILL NOT START until both files below exist. That is the
            # intended failure: a server told to check identity that cannot is
            # worse than one that refuses to run, because it looks healthy while
            # rejecting everybody. See deploy/README.md for the bootstrap.
            - name: CASAS_AUTH_MODE
              value: password
            - name: CASAS_AUTH_HTPASSWD
              value: /etc/casas-eternas/auth/htpasswd
            - name: CASAS_AUTH_SESSION_KEY
              value: /etc/casas-eternas/auth/session.key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /v1/capabilities rather than "/": it answers only once the modules
          # are mounted, so readiness means "can actually serve", not "has a
          # file". "/" would go green on a pod whose storage failed to open.
          readinessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/capabilities
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # Sized for what this pod actually does. An 8192² bake peaks near
          # 2.6 GB in the Node subprocess — that is the number the limit has to
          # clear, or the kernel kills the bake at 90% with no useful message.
          # The request stays low because that peak lasts minutes, not always.
          #
          # If this feels heavy for a pod that mostly serves files: that is the
          # argument for running `--target bake` in its own pod (or as a
          # Kubernetes Job), which the module split already allows.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 4Gi
          # Hardened, OpenShift restricted-v2 friendly. No runAsUser — OpenShift
          # injects an arbitrary UID from the namespace range (member of GID 0);
          # the image is built for exactly that. Verified with a read-only rootfs.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            # The bake subprocess is the only thing that wants scratch space,
            # and it wants real disk rather than memory: a tmpfs would come out
            # of the same budget the bake is already straining.
            - name: tmp
              mountPath: /tmp
            # Read-only, which is what the user administration will have to work
            # around later — see the Secret's own note.
            - name: auth
              mountPath: /etc/casas-eternas/auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: casas-eternas-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: auth
          secret:
            secretName: casas-eternas-auth
            # optional, so a Secret that is still empty lets the pod SCHEDULE and
            # fail with the server's own message about the missing key — rather
            # than hanging in ContainerCreating, where the reason is a kubelet
            # event nobody thinks to read.
            optional: true
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
spec:
  type: ClusterIP
  selector:
    app: casas-eternas
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: casas-eternas
  labels:
    app: casas-eternas
spec:
  # No host → OpenShift assigns one on the default apps domain.
  to:
    kind: Service
    name: casas-eternas
    weight: 100
  port:
    targetPort: http
  # Serve over HTTPS with the router's default cert; redirect plain HTTP to it.
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
